<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIU · Tablero de Resonancia</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; padding:24px; }
  h1 { font-size:1.3rem; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:.8rem; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .card h2 { font-size:.85rem; color:var(--acc); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; }
  .card ul { list-style:none; }
  .card li { padding:4px 0; font-size:.78rem; color:var(--dim); border-bottom:1px solid var(--border); }
  .card li:last-child { border-bottom:none; }
  .card li a { color:var(--text); text-decoration:none; }
  .card li a:hover { color:var(--acc); }
  .stat { display:flex; gap:20px; margin-bottom:20px; }
  .stat div { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px 20px; text-align:center; }
  .stat b { display:block; font-size:1.6rem; color:var(--ok); }
  .stat span { font-size:.7rem; color:var(--dim); }
  .live { margin-top:20px; }
  .live h2 { font-size:.85rem; color:var(--acc); margin-bottom:10px; }
  #gossip { max-height:340px; overflow-y:auto; }
  .g { border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:.75rem; }
  .g .tipo { color:var(--warn); }
  .g .meta { color:var(--dim); font-size:.68rem; }
  button { background:#21262d; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 14px; font-family:inherit; cursor:pointer; font-size:.75rem; margin-right:8px; }
  button:hover { border-color:var(--acc); }
  input { background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-family:inherit; font-size:.75rem; width:200px; }
</style>
</head>
<body>
<h1>MIU · Tablero de Resonancia</h1>
<div class="sub" id="version">red-v3-20261108 · cargando…</div>
<div class="stat">
  <div><b id="s-red">—</b><span>vercel alcance</span></div>
  <div><b id="s-fed">—</b><span>supabase fed.</span></div>
  <div><b id="s-cf">—</b><span>mesh CF</span></div>
  <div><b id="s-gossip">—</b><span>gossip vivo</span></div>
</div>
<div class="grid" id="grid"></div>
<div class="live">
  <h2>Pulso del micelio (gossip)</h2>
  <button onclick="cargarPulso()">Recargar pulso</button>
  <button onclick="cargarCorpus()">Buscar corpus</button>
  <input id="q" placeholder="término corpus…" onkeydown="if(event.key==='Enter')cargarCorpus()">
  <div id="gossip" style="margin-top:12px"></div>
</div>
<script>
async function cargarMapa() {
  const r = await fetch("/api/red"); const m = await r.json();
  document.getElementById("version").textContent = m.version + " · sirviendo desde " + m.sirviendo_desde;
  document.getElementById("s-red").textContent = m.nodos_alcance_vercel.length;
  document.getElementById("s-fed").textContent = m.federacion_supabase.total;
  document.getElementById("s-cf").textContent = m.mesh_cf_v270.length;
  const g = document.getElementById("grid");
  const secciones = [
    ["Nodos alcance", m.nodos_alcance_vercel.map(u => `<li><a href="${u}" target="_blank">${u.replace("https://","")}</a></li>`).join("")],
    ["Mesh Cloudflare", m.mesh_cf_v270.map(u => `<li><a href="${u}" target="_blank">${u.replace("https://miu-mesh-","").replace(".workers.dev","")}</a></li>`).join("")],
    ["Federación Supabase", m.federacion_supabase.nodos.map(n => `<li>${n.nombre} <span style="color:var(--dim)">(${n.region}) · ${n.tablas.length} tablas</span></li>`).join("")],
    ["Capacidades francho", Object.entries(m.capacidades_franchescopalacios9).map(([k,u]) => `<li><a href="${u}" target="_blank">${k}</a></li>`).join("")],
  ];
  g.innerHTML = secciones.map(([t,l]) => `<div class="card"><h2>${t}</h2><ul>${l}</ul></div>`).join("");
}
async function cargarPulso() {
  const d = document.getElementById("gossip");
  d.innerHTML = "cargando…";
  const r = await fetch("/api/pulso?limit=15"); const j = await r.json();
  document.getElementById("s-gossip").textContent = j.count ?? 0;
  if (j.error) { d.innerHTML = `<div class="g"><span class="tipo">${j.error}</span><div class="meta">${JSON.stringify(j.intentos||[])}</div></div>`; return; }
  d.innerHTML = `<div class="g meta" style="color:var(--ok)">fuente: ${j.fuente}${j.nota? " · "+j.nota : ""}</div>` +
    j.gossip.map(g => `<div class="g"><span class="tipo">[${g.tipo}]</span> ${g.origen}<div class="meta">#${g.id} · ${g.ts}</div></div>`).join("");
}
async function cargarCorpus() {
  const q = document.getElementById("q").value.trim();
  if (q.length < 3) { alert("mínimo 3 caracteres"); return; }
  const d = document.getElementById("gossip");
  d.innerHTML = "buscando en corpus…";
  const r = await fetch("/api/corpus?q=" + encodeURIComponent(q) + "&limit=8"); const j = await r.json();
  if (j.error) { d.innerHTML = `<div class="g"><span class="tipo">${j.error}</span></div>`; return; }
  d.innerHTML = j.resultados.map(c => `<div class="g"><span class="tipo">kτ=${c.ktau}</span> ${c.pregunta}<div class="meta">${(c.respuesta||"").slice(0,220)}…</div></div>`).join("");
}
cargarMapa(); cargarPulso();
</script>
</body>
</html>
