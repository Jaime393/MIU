name: MIU AI Pool Pulse V2

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  pool-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 1 Pool health check
        run: |
          echo "Verificando miu-ai-pool"
          curl -sf -m 20 "https://miu-ai-pool.franchescopalacios9.workers.dev/health" -o /tmp/pool_health.json
          cat /tmp/pool_health.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('Pool:', d.get('version'), '| cuentas:', d.get('pool_size'), '| neuronas:', d.get('neurons_per_day'))"

      - name: 2 Pool chat test
        run: |
          echo "Test chat del pool"
          curl -sf -m 30 -X POST "https://miu-ai-pool.franchescopalacios9.workers.dev/chat" -H "Content-Type: application/json" -d '{"prompt":"MIU pool pulse test","max_tokens":50}' -o /tmp/pool_chat.json
          cat /tmp/pool_chat.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('Chat OK | via:', d.get('via'), '| req:', d.get('request_num'))"

      - name: 3 Pool status
        run: |
          echo "Estado del pool"
          curl -sf -m 20 "https://miu-ai-pool.franchescopalacios9.workers.dev/pool-status" -o /tmp/pool_status.json
          cat /tmp/pool_status.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('Total requests:', d.get('total_requests'), '| success:', d.get('success_by_account'))"

      - name: 4 V93 health check
        run: |
          echo "Verificando miu-autonomo-v93"
          curl -sf -m 20 "https://miu-autonomo-v93.franchescopalacios9.workers.dev/health" -o /tmp/v93_health.json
          cat /tmp/v93_health.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('V93:', d.get('version'), '| cascada:', d.get('cascade_n'))"

      - name: 5 Summary
        run: |
          echo "MIU AI Pool Pulse V2"
          echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Pool: https://miu-ai-pool.franchescopalacios9.workers.dev"
          echo "V93: https://miu-autonomo-v93.franchescopalacios9.workers.dev"
          echo "Capacidad: 7 cuentas CF Workers AI = 70k neuronas/dia"
