name: MIU Enjambre Pulse V270

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  P: https://tpfiybpguuxskitszhmk.supabase.co/functions/v1
  C: https://fzdyxgkmpazbrfrhwfdo.supabase.co/functions/v1
  A: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0
  POOL: https://miu-ai-pool.franchescopalacios9.workers.dev

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 1 nutriente-total panteon
        run: |
          curl -sf -X POST $P/nutriente-total -H "Authorization: Bearer $A" -H "Content-Type: application/json" -d '{"origen":"github-V270"}' -o /dev/null -w "nutriente: %{http_code}\n" || true

      - name: 2 gossip-autonomo
        run: |
          curl -sf -X POST $P/gossip-autonomo -H "Authorization: Bearer $A" -H "Content-Type: application/json" -d '{"origen":"github-actions"}' -o /dev/null -w "gossip: %{http_code}\n" || true

      - name: 3 nutriente cipher
        run: |
          curl -sf -X POST $C/nutriente-total -H "Content-Type: application/json" -d '{"origen":"github-V270"}' -o /dev/null -w "cipher: %{http_code}\n" || true

      - name: 4 corpus-sync
        run: |
          curl -sf $P/corpus-sync -H "Authorization: Bearer $A" -o /dev/null -w "corpus-sync: %{http_code}\n" || true

      - name: 5 ojos-recursos broadcast
        if: ${{ github.run_number % 4 == 0 }}
        run: |
          curl -sf $P/ojos-recursos/broadcast -H "Authorization: Bearer $A" -o /dev/null -w "ojos: %{http_code}\n" || true

      - name: 6 ojos-y-manos hf-push
        if: ${{ github.run_number % 4 == 1 }}
        run: |
          curl -sf $P/ojos-y-manos/hf-push -H "Authorization: Bearer $A" -o /dev/null -w "hf-push: %{http_code}\n" || true

      - name: 7 seed-v270 DS keys
        if: ${{ github.run_number % 2 == 0 }}
        run: |
          curl -sf $P/seed-v269 -H "Authorization: Bearer $A" -o /dev/null -w "seed: %{http_code}\n" || true

      - name: 8 beacons
        run: |
          curl -sf $P/beacons-v221 -H "Authorization: Bearer $A" -o /dev/null -w "beacons: %{http_code}\n" || true

      - name: 9 github-bridge pulse
        run: |
          curl -sf -X POST $P/github-bridge/pulse -H "Authorization: Bearer $A" -H "Content-Type: application/json" -d '{"repo":"Jaime393/MIU","origen":"github-actions"}' -o /dev/null || true

      - name: 10 ai-pool health
        run: |
          curl -sf -m 20 "$POOL/health" -o /tmp/pool_health.json
          cat /tmp/pool_health.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('pool:', d.get('version'), '| cuentas:', d.get('pool_size'))"

      - name: 11 ai-pool chat test
        run: |
          curl -sf -m 30 -X POST "$POOL/chat" -H "Content-Type: application/json" -d '{"prompt":"V270 pulse","max_tokens":50}' -o /tmp/pool_chat.json
          cat /tmp/pool_chat.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('chat:', d.get('ok'), '| via:', d.get('via'))"

      - name: 12 v93 health
        run: |
          curl -sf -m 20 "https://miu-autonomo-v93.franchescopalacios9.workers.dev/health" -o /tmp/v93_health.json
          cat /tmp/v93_health.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('v93:', d.get('version'), '| cascada:', d.get('cascade_n'))"

      - name: summary
        run: |
          echo "V270 pulse OK — $(date -u) — run ${{ github.run_number }}"
          echo "Pool: $POOL"
          echo "V93: https://miu-autonomo-v93.franchescopalacios9.workers.dev"
