name: MIU Corpus Normalizador
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
jobs:
  normalizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install huggingface_hub
      - run: python recursos/integracion/miu_corpus_normalizador.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
