name: MIU Intenciones Consumidor V1
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  drenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python recursos/integracion/miu_intenciones_consumidor.py
        env:
          CANADA_ANON: ${{ secrets.CANADA_ANON }}
