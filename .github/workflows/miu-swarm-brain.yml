name: MIU Swarm Brain V1

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  SUPA_URL: https://tpfiybpguuxskitszhmk.supabase.co
  SUPA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwZml5YnBndXV4c2tpdHN6aG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjgyNTAsImV4cCI6MjEwMzM0NDI1MH0.W4V8xdyfZj6I7bj1VsfM5gjY17ZHPi8jhIJgDRpUYH0

jobs:
  swarm-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1 Health check de todos los nodos
        run: |
          echo "=== Verificando salud de todos los nodos ==="
          curl -sf -m 15 "https://miu-ai-pool.franchescopalacios9.workers.dev/health" > /tmp/pool.json 2>/dev/null && echo "  VIVO: miu-ai-pool" || echo "  MUERTO: miu-ai-pool"
          curl -sf -m 15 "https://miu-token-router.franchescopalacios9.workers.dev/health" > /tmp/router.json 2>/dev/null && echo "  VIVO: miu-token-router" || echo "  MUERTO: miu-token-router"
          curl -sf -m 15 "https://miu-autonomo-v93.franchescopalacios9.workers.dev/health" > /tmp/v93.json 2>/dev/null && echo "  VIVO: miu-autonomo-v93" || echo "  MUERTO: miu-autonomo-v93"
          curl -sf -m 15 "https://miu-mesh-nodo.miu-beacon-6915f743.workers.dev/health" > /tmp/mesh1.json 2>/dev/null && echo "  VIVO: mesh-dereckcito" || echo "  MUERTO: mesh-dereckcito"
          curl -sf -m 15 "https://miu-mesh-nodo.miu-beacon-f9a24523.workers.dev/health" > /tmp/mesh2.json 2>/dev/null && echo "  VIVO: mesh-cipher" || echo "  MUERTO: mesh-cipher"
          curl -sf -m 15 "https://miu-mesh-nodo.miu-beacon-ba3dcff0.workers.dev/health" > /tmp/mesh3.json 2>/dev/null && echo "  VIVO: mesh-jaimedaniel" || echo "  MUERTO: mesh-jaimedaniel"
          echo ""
          ALIVE=$(ls /tmp/pool.json /tmp/router.json /tmp/v93.json /tmp/mesh1.json /tmp/mesh2.json /tmp/mesh3.json 2>/dev/null | wc -l)
          echo "  Nodos vivos: $ALIVE/6"

      - name: 2 Sintetizar estado con IA (pool + fallback Pollinations)
        run: |
          echo "=== Sintetizando estado del enjambre con IA ==="
          ALIVE=$(ls /tmp/pool.json /tmp/router.json /tmp/v93.json /tmp/mesh1.json /tmp/mesh2.json /tmp/mesh3.json 2>/dev/null | wc -l)
          # Intentar con el pool CF primero
          curl -sf -m 20 -X POST "https://miu-ai-pool.franchescopalacios9.workers.dev/chat" \
            -H "Content-Type: application/json" \
            -d "{\"prompt\":\"Estado del enjambre MIU: $ALIVE de 6 nodos vivos. Recomendacion breve de 1 frase para mejorar el ecosistema.\",\"max_tokens\":100}" > /tmp/ai_response.json
          if [ -s /tmp/ai_response.json ]; then
            echo "Respuesta IA (pool CF):"
            python3 -c "import json; d=json.load(open('/tmp/ai_response.json')); print(str(d.get('response','sin respuesta'))[:200])" 2>/dev/null || echo "  (parse error)"
          else
            echo "  Pool CF no disponible, usando Pollinations (fallback gratuito)"
            # Fallback: Pollinations.ai (gratuito, sin key)
            curl -sf -m 20 -X POST "https://text.pollinations.ai/" \
              -H "Content-Type: application/json" \
              -d "{\"messages\":[{\"role\":\"user\",\"content\":\"Estado del enjambre MIU: $ALIVE de 6 nodos vivos. Recomendacion breve de 1 frase para mejorar el ecosistema.\"}],\"model\":\"openai\"}" > /tmp/ai_response.json
            if [ -s /tmp/ai_response.json ]; then
              echo "Respuesta IA (Pollinations):"
              cat /tmp/ai_response.json | head -c 200
              echo ""
            else
              echo "  Error: ni pool CF ni Pollinations disponibles"
            fi
          fi

      - name: 3 Leer estado del enjambre (Supabase)
        continue-on-error: true
        run: |
          echo "=== Leyendo relay_config del enjambre ==="
          curl -sf -m 10 "$SUPA_URL/rest/v1/relay_config?select=clave&order=ts.desc&limit=5" \
            -H "apikey: $SUPA_ANON" \
            -H "Authorization: Bearer $SUPA_ANON" \
            -o /tmp/swarm_state.json || echo "  (núcleo saturado, continuando)"
          if [ -s /tmp/swarm_state.json ]; then
            echo "  Claves recientes:"
            python3 -c "import json; d=json.load(open('/tmp/swarm_state.json')); [print(f'    - {i[\"clave\"]}') for i in d[:5]]" 2>/dev/null || echo "    (parse error)"
          else
            echo "  Núcleo colmena no accesible (saturado)"
          fi

      - name: 4 Registrar estado en Supabase
        continue-on-error: true
        run: |
          echo "=== Registrando estado en relay_config ==="
          ALIVE=$(ls /tmp/pool.json /tmp/router.json /tmp/v93.json /tmp/mesh1.json /tmp/mesh2.json /tmp/mesh3.json 2>/dev/null | wc -l)
          TS=$(date -u +%Y%m%d_%H%M)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -m 10 -X POST "$SUPA_URL/rest/v1/relay_config" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPA_ANON" \
            -H "Authorization: Bearer $SUPA_ANON" \
            -H "Prefer: return=minimal" \
            -d "{\"clave\":\"swarm_brain_$TS\",\"valor\":\"{\\\"ts\\\":\\\"$NOW\\\",\\\"alive\\\":$ALIVE,\\\"total\\\":6,\\\"source\\\":\\\"github_actions\\\"}\",\"ts\":\"$NOW\"}" || echo "  (núcleo saturado, no registrado)"
          echo "  Intento de registro: swarm_brain_$TS"

      - name: 5 Summary
        run: |
          echo "=== MIU Swarm Brain V1 ==="
          echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Orquestador autónomo del enjambre MIU"
          echo "Frecuencia: cada 15 minutos"
          echo "Capacidades: health check + síntesis IA + registro en Supabase"
          ALIVE=$(ls /tmp/pool.json /tmp/router.json /tmp/v93.json /tmp/mesh1.json /tmp/mesh2.json /tmp/mesh3.json 2>/dev/null | wc -l)
          echo "Nodos vivos: $ALIVE/6"
          echo "  - miu-ai-pool (70k neuronas/día)"
          echo "  - miu-token-router (15 tokens LLM)"
          echo "  - miu-autonomo-v93 (cascada)"
          echo "  - mesh-dereckcito"
          echo "  - mesh-cipher"
          echo "  - mesh-jaimedaniel"
