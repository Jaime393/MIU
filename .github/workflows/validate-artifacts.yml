name: Validate Artifacts V1

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar stubs y placeholders
        run: |
          echo "=== Detectando stubs y placeholders ==="
          STUBS=0
          # Detectar archivos con contenido placeholder
          for f in $(find . -name "*.md" -o -name "*.json" -o -name "*.yml" | grep -v ".git/" | head -50); do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f")
              if [ "$SIZE" -lt 50 ]; then
                echo "STUB: $f (${SIZE} bytes)"
                STUBS=$((STUBS+1))
              fi
            fi
          done
          echo "Total stubs detectados: $STUBS"

      - name: Detectar archivos byte-identicos sospechosos
        run: |
          echo "=== Detectando archivos duplicados ==="
          find . -type f -not -path "./.git/*" -not -name "*.lock" | head -100 | xargs md5sum 2>/dev/null | sort | uniq -d -w 32 | head -10
          echo "=== Fin detección duplicados ==="

      - name: Detectar hashes placeholder
        run: |
          echo "=== Detectando hashes placeholder ==="
          grep -r "PLACEHOLDER\|TODO\|FIXME\|XXX" --include="*.md" --include="*.json" --include="*.yml" . 2>/dev/null | head -10 || true

      - name: Detectar manifiestos truncados
        run: |
          echo "=== Detectando manifiestos truncados ==="
          for f in $(find . -name "MANIFIESTO*" -o -name "manifest*" | grep -v ".git/"); do
            if [ -f "$f" ]; then
              # Verificar si el JSON es válido (one-liner: el bloque multilinea en columna 1 rompia el YAML)
              python3 -c "import json,sys; json.load(open(sys.argv[1])); print('OK: '+sys.argv[1])" "$f" 2>/dev/null || echo "TRUNCADO/NO_JSON: $f"
            fi
          done

      - name: Detectar extensiones que no coinciden con MIME
        run: |
          echo "=== Detectando MIME mismatch ==="
          for f in $(find . -type f -not -path "./.git/*" | head -100); do
            EXT="${f##*.}"
            MIME=$(file --mime-type -b "$f" 2>/dev/null)
            case "$EXT" in
              json) [[ "$MIME" != *"json"* ]] && echo "MISMATCH: $f es $MIME pero extension .json" ;;
              yml|yaml) [[ "$MIME" != *"yaml"* && "$MIME" != *"text"* ]] && echo "MISMATCH: $f es $MIME pero extension .$EXT" ;;
              md) [[ "$MIME" != *"text"* ]] && echo "MISMATCH: $f es $MIME pero extension .md" ;;
            esac
          done

      - name: Resumen validacion
        run: |
          echo "=== RESUMEN VALIDACIÓN ==="
          echo "Archivo: validate-artifacts.yml V1"
          echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Repo: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Estado: VALIDACIÓN COMPLETADA"
